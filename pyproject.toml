[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "openrouter-video"
version = "0.1.0"
description = "Desktop GUI for OpenRouter HeyGen video generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6,<7",
    "keyring>=24,<26",
]

[project.scripts]
openrouter-video = "video_app.cli:main"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "video_app/**/*.py" },
]

[tool.hatch.build.targets.wheel]
packages = ["video_app"]

[tool.hatch.build.targets.sdist]
include = [
    "/video_app",
    "/tests",
    "/main.py",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
